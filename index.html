<!DOCTYPE html>
<html>
    <head>
        <title>Quotation Elements</title>
    </head>

    <body>

        <q>This is a quote example</q>

        <p>This is a quote example</p>

        <blockquote cite="https://www.wikipedia.com">
            This is a quote example
        </blockquote>

        <p>
            I'm learning
            <abbr title="HyperText Markup Language">HTML</abbr>
        </p>

        <p>
            <abbr title="World Wide Web">WWW</abbr> means:
        </p>

        <address>
            Our address:<br>
            Tehran<br>
            Azadi
        </address>

        <p>
            <cite>Mona Lisa</cite> by Leonardo da Vinci,
            painted around 1503–1519.
        </p>

        <p>
            <bdo dir="rtl">This is an example</bdo>
        </p>

        <p>
            <bdo dir="ltr">This is an example</bdo>
        </p>

    </body>
</html>
