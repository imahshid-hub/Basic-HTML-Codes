<!DOCTYPE html>
<html>
    <head>
        <title>Iframe in HTML</title>
    </head>

    <body>

        <iframe
            width="400"
            height="300"
            title="Urmia University website"
            src="https://wikipedia.org">
        </iframe>

        <iframe
            width="400"
            height="300"
            title="Taylor Swift's Wikipedia page"
            src="https://en.wikipedia.org/wiki/Taylor_Swift"
            scrolling="yes">
        </iframe>

        <iframe
            width="400"
            height="300"
            title="Stranger Things Wikipedia page"
            src="https://en.wikipedia.org/wiki/Stranger_Things">
        </iframe>

    </body>
</html>
